<!DOCTYPE html>
<html lang="is">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skólanámskrá Vallaskóla</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#fcfbf9] min-h-screen text-slate-800 font-sans p-4 md:p-8">

  <!-- HAUS / LÓGÓ OG TITILL -->
  <header class="max-w-4xl mx-auto text-center pt-8 pb-10 space-y-4">
    <!-- Lógó Vallaskóla -->
    <div class="flex justify-center mb-2">
      <img src="logo.jpg" alt="Vallaskóli Lógó" class="h-28 md:h-36 object-contain" onerror="this.style.display='none'; document.getElementById('fallbackLogo').style.display='inline-flex';">
      <div id="fallbackLogo" class="hidden items-center justify-center w-20 h-20 rounded-2xl bg-sky-600 text-white font-extrabold text-2xl shadow-md">
        V
      </div>
    </div>
    
    <div class="space-y-2">
      <p class="text-xs md:text-sm font-semibold tracking-wider text-sky-800 uppercase italic">
        Virðing &bull; Þekking &bull; Lífsgleði
      </p>
      <h1 class="text-3xl md:text-5xl font-extrabold text-slate-900 tracking-tight">
        Skólanámskrá Vallaskóla
      </h1>
      <p class="text-sm text-slate-500 max-w-md mx-auto pt-1">
        Aðalnámskrá, markmið, námsmat og skipulag kennslu fyrir alla árganga og stoðþjónustu skólans.
      </p>
    </div>
  </header>

  <!-- MEGINMÁL - FLÍSAGRID -->
  <main class="max-w-4xl mx-auto mb-16">
    <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4" id="tilesContainer">
      <!-- Flísarnar myndast sjálfkrafa úr JS -->
    </div>
  </main>

  <!-- POP-UP GLUGGI FYRIR ÍTARLEGRA EFNI -->
  <div id="modal" class="fixed inset-0 bg-black/40 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
    <div class="bg-white rounded-3xl max-w-2xl w-full p-6 md:p-8 shadow-xl relative border border-slate-100 max-h-[85vh] flex flex-col">
      <button onclick="closeModal()" class="absolute top-5 right-5 text-slate-400 hover:text-slate-700 font-bold text-lg p-1 transition">✕</button>
      
      <div class="flex items-center gap-3 mb-4 pr-6">
        <span id="modalIcon" class="text-3xl"></span>
        <h3 id="modalTitle" class="text-xl font-bold text-slate-900"></h3>
      </div>
      
      <div id="modalContent" class="text-sm text-slate-600 overflow-y-auto space-y-4 pr-1 flex-1"></div>
      
      <button onclick="closeModal()" class="w-full mt-6 py-3 bg-slate-900 hover:bg-slate-800 text-white rounded-xl text-xs font-semibold transition">Loka glugga</button>
    </div>
  </div>

  <script>
    // Grunnlisti yfir allar flísar
    const TILES = [
      { id: '1', title: '1. árgangur', icon: '🌱' },
      { id: '2', title: '2. árgangur', icon: '🍃' },
      { id: '3', title: '3. árgangur', icon: '🌿' },
      { id: '4', title: '4. árgangur', icon: '☘️' },
      { id: '5', title: '5. árgangur', icon: '🍀' },
      { id: '6', title: '6. árgangur', icon: '🌲' },
      { id: '7', title: '7. árgangur', icon: '🌳' },
      { id: '8', title: '8. árgangur', icon: '🎓' },
      { id: '9', title: '9. árgangur', icon: '📘' },
      { id: '10', title: '10. árgangur', icon: '🚀' },
      { id: 'isat', title: 'ÍSAT', icon: '🌍' },
      { id: 'stod', title: 'Stoðþjónusta', icon: '🤝' }
    ];

    // Efnisinnihald fyrir hverja flís
    const TILES_DATA = {
      '1': {
        title: '1. árgangur — Skólanámskrá',
        icon: '🌱',
        content: `
          <div class="space-y-6 text-slate-700">
            
            <!-- ÍSLENSKA -->
            <div class="space-y-3">
              <div class="flex items-center gap-2 border-b border-sky-100 pb-2">
                <span class="text-lg">📖</span>
                <h3 class="font-bold text-sky-900 text-base">Íslenska</h3>
              </div>

              <div>
                <h4 class="font-semibold text-xs text-slate-500 uppercase tracking-wider mb-1">Markmið</h4>
                <p class="text-xs text-slate-600 italic bg-slate-50 p-3 rounded-xl border border-slate-100">
                  Megintilgangur náms og kennslu í íslensku er að nemendur fái tækifæri til að efla málnotkun, tjáningu og sköpun í töluðu og rituðu máli, nota málið og kynnast mætti þess og fjölbreytileika í daglegu lífi, leik og starfi.
                </p>
              </div>

              <div>
                <h4 class="font-semibold text-xs text-slate-500 uppercase tracking-wider mb-1">Hæfniviðmið</h4>
                <ul class="list-disc pl-4 text-xs space-y-1 text-slate-600">
                  <li><strong>Talað mál & hlustun:</strong> Beitt skýrum framburði, horft og hlustað af athygli.</li>
                  <li><strong>Lestur & lesskilningur:</strong> Beitt aðferðum við umskráningu hljóða og stafa.</li>
                  <li><strong>Bókmenntir:</strong> Unnið með ævintýri, sögur og ljóð ætluð börnum.</li>
                  <li><strong>Ritun:</strong> Dregið rétt til stafs, skrifað skýrt og beitt einföldum stafsetningsreglum.</li>
                  <li><strong>Mál & málnotkun:</strong> Þekkt einkenni málsins, rímað og farið í orðaleiki.</li>
                </ul>
              </div>

              <div>
                <h4 class="font-semibold text-xs text-slate-500 uppercase tracking-wider mb-1">Námsefni</h4>
                <ul class="list-disc pl-4 text-xs space-y-1 text-sky-700">
                  <li><a href="https://mms.is/namsefni/lestrarlandid-vb1-rafbok" target="_blank" class="hover:underline">Lestrarland 1 (Rafbók) ↗</a></li>
                  <li><a href="https://mms.is/namsefni/lestrarlandid-vb-2-rafbok" target="_blank" class="hover:underline">Lestrarland 2 (Rafbók) ↗</a></li>
                  <li><a href="https://mms.is/namsefni/skrift-1a" target="_blank" class="hover:underline">Skrift 1a ↗</a> og <a href="https://mms.is/namsefni/skrift-1b-rafbok" target="_blank" class="hover:underline">Skrift 1b ↗</a></li>
                  <li><a href="https://island.is/s/midstod-menntunar-og-skolathjonustu/leid-til-laesis-lesskimun-fyrir-1-bekk" target="_blank" class="hover:underline">Leið til læsis - lesskimun ↗</a></li>
                </ul>
              </div>

              <div>
                <h4 class="font-semibold text-xs text-slate-500 uppercase tracking-wider mb-1">Námsmat</h4>
                <p class="text-xs text-slate-600">Símat, verkefnavinna og lesfimi (3x á skólaári). Metið með matskvörðunum: <em>Hæfni náð</em>, <em>Á góðri leið</em>, <em>Þarfnast þjálfunar</em>.</p>
              </div>
            </div>

            <hr class="border-slate-100" />

            <!-- STÆRÐFRÆÐI -->
            <div class="space-y-3">
              <div class="flex items-center gap-2 border-b border-sky-100 pb-2">
                <span class="text-lg">📐</span>
                <h3 class="font-bold text-sky-900 text-base">Stærðfræði</h3>
              </div>

              <div>
                <h4 class="font-semibold text-xs text-slate-500 uppercase tracking-wider mb-1">Markmið</h4>
                <p class="text-xs text-slate-600 italic bg-slate-50 p-3 rounded-xl border border-slate-100">
                  Megintilgangur náms og kennslu í stærðfræði er að nemendur öðlist alhliða hæfni og skilning til að nota stærðfræði sem verkfæri í fjölbreyttum tilgangi í daglegu lífi, leik og starfi.
                </p>
              </div>

              <div>
                <h4 class="font-semibold text-xs text-slate-500 uppercase tracking-wider mb-1">Hæfniviðmið</h4>
                <ul class="list-disc pl-4 text-xs space-y-1 text-slate-600">
                  <li><strong>Vinnulag:</strong> Nýtir verkfæri og hlutbundin gögn, tekur þátt í samræðum og notar rétt heiti yfir tákn.</li>
                  <li><strong>Algebra:</strong> Kannar, býr til og tjáir sig um reglur í talnarunum og myndrænum mynstrum.</li>
                </ul>
              </div>

              <div>
                <h4 class="font-semibold text-xs text-slate-500 uppercase tracking-wider mb-1">Námsefni</h4>
                <ul class="list-disc pl-4 text-xs space-y-1 text-sky-700">
                  <li><a href="https://mms.is/namsefni/sproti-1a-nemendabok" target="_blank" class="hover:underline">Sproti 1a (Nemendabók) ↗</a> og <a href="https://mms.is/namsefni/sproti-1a-aefingahefti" target="_blank" class="hover:underline">Æfingahefti ↗</a></li>
                  <li><a href="https://mms.is/namsefni/sproti-1b-nemendabok" target="_blank" class="hover:underline">Sproti 1b (Nemendabók) ↗</a> og <a href="https://mms.is/namsefni/sproti-1b-aefingahefti" target="_blank" class="hover:underline">Æfingahefti ↗</a></li>
                  <li><a href="https://mms.is/namsefni/skrift-tolustafir" target="_blank" class="hover:underline">Skrift tölustafir ↗</a></li>
                  <li><a href="https://mms.is/namsefni/staerdfraedispaejarar-1-rafbok" target="_blank" class="hover:underline">Stærðfræðispæjarar 1 ↗</a></li>
                </ul>
              </div>

              <div>
                <h4 class="font-semibold text-xs text-slate-500 uppercase tracking-wider mb-1">Námsmat</h4>
                <p class="text-xs text-slate-600">Símat og verkefnavinna metin út frá hæfniviðmiðum.</p>
              </div>
            </div>

            <!-- TENGINGAR Í AÐRAR FLÍSAR -->
            <div class="pt-4 border-t border-slate-100 flex flex-wrap items-center justify-between gap-2">
              <span class="text-xs text-slate-500 font-medium">Tengd þjónusta:</span>
              <div class="flex gap-2">
                <button onclick="openTile('isat')" class="px-3 py-1.5 bg-sky-50 hover:bg-sky-100 text-sky-800 rounded-xl text-xs font-semibold transition">
                  🌍 ÍSAT stuðningur
                </button>
                <button onclick="openTile('stod')" class="px-3 py-1.5 bg-sky-50 hover:bg-sky-100 text-sky-800 rounded-xl text-xs font-semibold transition">
                  🤝 Stoðþjónusta
                </button>
              </div>
            </div>

          </div>
        `
      },
      'isat': {
        title: 'ÍSAT — Íslenska sem annað mál',
        icon: '🌍',
        content: `
          <div class="space-y-4">
            <p class="text-xs text-slate-600 leading-relaxed">ÍSAT veitir nemendum með annað móðurmál en íslensku málörvun og einstaklingsbundinn stuðning.</p>
            
            <div class="p-3 bg-sky-50 rounded-xl border border-sky-100 text-xs text-sky-950 space-y-1">
              <strong>Skipulag kennslu:</strong> Kennsla fer fram í litlum hópum eða innan bekkjar í samstarfi við umsjónarkennara.
            </div>

            <div class="pt-2 border-t border-slate-100 space-y-2">
              <span class="text-xs font-semibold text-slate-500 block">Skoða námsáætlanir árganga:</span>
              <div class="flex flex-wrap gap-1.5">
                <button onclick="openTile('1')" class="px-2.5 py-1 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-medium rounded-lg">1. árg</button>
                <button onclick="openTile('2')" class="px-2.5 py-1 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-medium rounded-lg">2. árg</button>
                <button onclick="openTile('7')" class="px-2.5 py-1 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-medium rounded-lg">7. árg</button>
                <button onclick="openTile('10')" class="px-2.5 py-1 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-medium rounded-lg">10. árg</button>
              </div>
            </div>
          </div>
        `
      },
      'stod': {
        title: 'Stoðþjónusta Vallaskóla',
        icon: '🤝',
        content: `
          <div class="space-y-4">
            <p class="text-xs text-slate-600 leading-relaxed">Stoðþjónusta nær yfir sérkennslu, námsráðgjöf, skólaheilsuvernd og sálfræðiþjónustu.</p>
            
            <div class="p-3 bg-slate-50 rounded-xl border border-slate-100 text-xs text-slate-700 space-y-1">
              <strong>Tilvísunarferli:</strong> Umsóknir og tilvísanir um sérstakan stuðning í kennslu.
            </div>
          </div>
        `
      }
    };

    function renderTiles() {
      const container = document.getElementById('tilesContainer');
      container.innerHTML = TILES.map(tile => `
        <div onclick="openTile('${tile.id}')" class="p-6 bg-white border border-slate-200/80 rounded-2xl hover:border-sky-500 hover:shadow-md hover:-translate-y-0.5 transition cursor-pointer text-center group flex flex-col items-center justify-center space-y-3">
          <span class="text-3xl group-hover:scale-110 transition-transform duration-200">${tile.icon}</span>
          <h2 class="text-xs font-bold text-slate-800 group-hover:text-sky-700 transition">${tile.title}</h2>
        </div>
      `).join('');
    }

    function openTile(id) {
      const item = TILES_DATA[id];
      
      // Ef efni er ekki enn tilbúið fyrir tiltekinn árgang:
      const title = item ? item.title : `${id}. árgangur`;
      const icon = item ? item.icon : '📚';
      const content = item ? item.content : `
        <div class="space-y-3">
          <p class="text-xs text-slate-600">Námskrá og námsáætlanir fyrir ${id}. árgang eru í vinnslu.</p>
          <div class="p-4 bg-sky-50/50 border border-sky-100 rounded-2xl text-xs text-sky-900">
            Hér munu koma markmið, hæfniviðmið, námsefni og námsmat fyrir ${id}. árgang.
          </div>
        </div>
      `;

      document.getElementById('modalIcon').innerText = icon;
      document.getElementById('modalTitle').innerText = title;
      document.getElementById('modalContent').innerHTML = content;
      document.getElementById('modal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('modal').style.display = 'none';
    }

    renderTiles();
  </script>
</body>
</html>
